<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="The living identity system and creation toolkit for Noviteq Solutions." />
    <title>Noviteq Brand Hub</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07090d; color: #f7f9fc; font: 16px/1.5 Arial, sans-serif; }
      main { width: min(720px, calc(100% - 40px)); padding: 64px 0; }
      .mark { width: 64px; height: 64px; margin-bottom: 36px; }
      .eyebrow { color: #49c8ff; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 16px 0 22px; font-size: clamp(3.5rem, 10vw, 6.5rem); letter-spacing: -.075em; line-height: .82; }
      h1 span { color: #1686f8; }
      p { max-width: 520px; color: #b9c1cd; font-size: 18px; }
      a { display: inline-block; margin-top: 22px; border-radius: 999px; background: #1686f8; color: white; padding: 14px 20px; font-weight: 700; text-decoration: none; }
      footer { margin-top: 84px; color: #77808d; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./favicon.svg" alt="Noviteq" />
      <div class="eyebrow">Noviteq Solutions · Brand system</div>
      <h1>Clarity,<br><span>built in.</span></h1>
      <p>The living identity system and creation toolkit for Noviteq Solutions.</p>
      <a href="https://noviteq-brand-hub.burnt-exe.chatgpt.site/">Open the Brand Hub →</a>
      <footer>Technology that moves your business forward.</footer>
    </main>
  </body>
</html>
